
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-task-api
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      DB_PATH: "/app/data/tasks.db"
    volumes:
      - task_data:/app/data
    restart: unless-stopped

volumes:
  task_data:
